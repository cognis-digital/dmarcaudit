[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-dmarcaudit"
version = "0.2.4"
description = "Grade SPF/DKIM/DMARC posture & spoofability from DNS records (passive by default; optional authorized read-only active DNS)"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "secops", "dmarcaudit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/dmarcaudit"

[project.scripts]
"dmarcaudit-emit" = "dmarcaudit.connect:emit_main"
dmarcaudit = "dmarcaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["dmarcaudit"]
include = ["dmarcaudit/data_feeds_2026.json"]

[tool.hatch.build.targets.wheel.force-include]
"VERSION" = "dmarcaudit/VERSION"

[tool.hatch.metadata]
allow-direct-references = true
